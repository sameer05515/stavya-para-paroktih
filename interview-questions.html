<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview Questions — Stavya Para Paroktih</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"DM Serif Display"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          colors: {
            surface: '#faf9f6',
            panel: '#fff',
            border: '#e8e4de',
            muted: '#6b6560',
            accent: '#8b6914',
            'accent-bg': '#f5eed9',
            hover: '#ebe6df',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    .tree-toggle[aria-current="true"] { background-color: #f5eed9; color: #8b6914; font-weight: 600; }
    .dark .tree-toggle[aria-current="true"] { background-color: rgb(120 53 15 / 0.4); color: #fbbf24; }
    @media (max-width: 767px) {
      .sidebar-open .sidebar-drawer { transform: translateX(0); }
      .sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col bg-surface dark:bg-neutral-900 text-neutral-800 dark:text-neutral-200 text-base leading-relaxed font-sans">
  <header class="shrink-0 py-3 px-4 sm:px-5 bg-panel dark:bg-neutral-800 border-b border-border dark:border-neutral-700 flex flex-wrap items-center gap-3 sm:gap-4">
    <div class="flex items-center gap-2 min-w-0 flex-1 sm:flex-initial">
      <button type="button" id="sidebarToggle" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border-0 bg-transparent cursor-pointer text-neutral-800 dark:text-neutral-200" aria-label="Toggle questions menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="font-serif text-lg sm:text-xl font-normal m-0 text-neutral-800 dark:text-neutral-100 truncate">Interview Questions</h1>
    </div>
    <div class="w-full sm:w-auto sm:flex-1 sm:min-w-0 sm:max-w-[320px] order-3 sm:order-none">
      <input type="text" id="search" placeholder="Search questions…" class="w-full py-2 px-3 border border-border dark:border-neutral-600 rounded-lg bg-surface dark:bg-neutral-800 placeholder:text-muted dark:placeholder:text-neutral-400 focus:outline-none focus:border-accent dark:focus:border-amber-500 focus:bg-panel dark:focus:bg-neutral-800 font-sans text-base text-neutral-800 dark:text-neutral-200" />
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" id="themeToggle" class="p-2 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border-0 bg-transparent cursor-pointer text-neutral-700 dark:text-neutral-300 focus:outline-none focus:ring-2 focus:ring-accent dark:focus:ring-amber-500 focus:ring-offset-2 dark:focus:ring-offset-neutral-900" aria-label="Toggle light/dark theme">
        <span id="themeIconLight" class="hidden dark:block"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></span>
        <span id="themeIconDark" class="block dark:hidden"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></span>
      </button>
      <label class="py-2 px-3 font-sans cursor-pointer bg-accent-bg dark:bg-amber-900/40 text-accent dark:text-amber-400 border border-amber-800/30 dark:border-amber-700/50 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900/60 text-sm whitespace-nowrap">
        <input type="file" id="fileInput" accept=".json" class="hidden" />
        Load from file
      </label>
      <span class="text-xs sm:text-sm text-muted dark:text-neutral-400 shrink-0" id="status">Loading…</span>
    </div>
  </header>

  <div class="fixed inset-0 z-30 bg-black/30 dark:bg-black/50 opacity-0 pointer-events-none transition-opacity md:hidden sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <main class="flex-1 flex min-h-0 relative">
    <aside id="sidebar" class="sidebar-drawer fixed md:relative inset-y-0 left-0 z-40 w-[280px] min-h-0 pt-14 md:pt-2 pb-2 -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out shrink-0 bg-panel dark:bg-neutral-800 border-r border-border dark:border-neutral-700 flex flex-col overflow-hidden" aria-label="Questions">
      <div id="treeContainer" class="py-2 overflow-y-auto min-h-0 flex-1"></div>
    </aside>
    <article class="flex-1 min-w-0 overflow-y-auto py-4 px-4 sm:py-6 sm:px-6 md:px-8 pb-8 bg-surface dark:bg-neutral-900">
      <div id="navBar" class="hidden flex items-center justify-between gap-4 mb-4 pb-3 border-b border-border dark:border-neutral-700">
        <button type="button" id="prevBtn" class="flex items-center gap-1.5 py-2 px-3 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border border-border dark:border-neutral-600 text-neutral-800 dark:text-neutral-200 font-medium text-sm cursor-pointer" aria-label="Previous question">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Prev
        </button>
        <span id="navPosition" class="text-sm text-muted dark:text-neutral-400 tabular-nums"></span>
        <button type="button" id="nextBtn" class="flex items-center gap-1.5 py-2 px-3 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border border-border dark:border-neutral-600 text-neutral-800 dark:text-neutral-200 font-medium text-sm cursor-pointer" aria-label="Next question">
          Next
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="detail"></div>
    </article>
  </main>

  <script>
    (function () {
      if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
        marked.setOptions({
          highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
            }
            try { return hljs.highlightAuto(code).value; } catch (e) { return code; }
          }
        });
      }

      const statusEl = document.getElementById('status');
      const treeContainer = document.getElementById('treeContainer');
      const detailEl = document.getElementById('detail');
      const searchInput = document.getElementById('search');
      const fileInput = document.getElementById('fileInput');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');

      function isMobile() { return window.matchMedia('(max-width: 767px)').matches; }
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }
      function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

      if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
      if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

      function getTheme() {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') return t;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function setTheme(theme) {
        localStorage.setItem('theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }
      document.getElementById('themeToggle').addEventListener('click', function() {
        setTheme(getTheme() === 'dark' ? 'light' : 'dark');
      });

      let questions = [];
      let questionById = new Map();
      let childrenByParentId = new Map();
      let orderedQuestionIds = [];
      let currentQuestionId = null;

      function buildOrderedList() {
        orderedQuestionIds = [];
        function visit(q) {
          orderedQuestionIds.push(q.uniqueId);
          (childrenByParentId.get(q.uniqueId) || []).forEach(visit);
        }
        (childrenByParentId.get('__root') || []).forEach(visit);
      }

      function buildIndex() {
        questionById.clear();
        childrenByParentId.clear();
        questions.forEach(function (q) {
          questionById.set(q.uniqueId, q);
          const pid = q.parentId || '__root';
          if (!childrenByParentId.has(pid)) childrenByParentId.set(pid, []);
          childrenByParentId.get(pid).push(q);
        });
        childrenByParentId.forEach(function (list) {
          list.sort(function (a, b) {
            const oa = a.order != null ? a.order : 9999;
            const ob = b.order != null ? b.order : 9999;
            if (oa !== ob) return oa - ob;
            return (a.name || '').localeCompare(b.name || '');
          });
        });
        buildOrderedList();
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function renderHtml(html) {
        return html && html.trim() ? html : '';
      }

      function renderMarkdown(md) {
        if (!md || !md.trim()) return '';
        if (typeof marked !== 'undefined') {
          try { return marked.parse(md); } catch (e) { return md; }
        }
        return '<pre>' + escapeHtml(md) + '</pre>';
      }

      function renderText(txt) {
        if (!txt || !txt.trim()) return '';
        return '<p class="my-2">' + escapeHtml(txt) + '</p>';
      }

      function renderSmartContent(smartContent) {
        if (!smartContent || !smartContent.content) return '';
        const type = (smartContent.textOutputType || '').toLowerCase();
        if (type === 'markdown') return renderMarkdown(smartContent.content);
        if (type === 'html') return renderHtml(smartContent.content);
        return renderText(smartContent.content);
      }

      const contentBlockClasses = 'mb-6 empty:hidden break-words [&_h1]:font-serif [&_h2]:font-serif [&_h3]:font-serif [&_h1]:font-normal [&_h2]:font-normal [&_h3]:font-normal [&_h1]:mt-4 [&_h2]:mt-4 [&_h3]:mt-4 [&_h1]:mb-2 [&_h2]:mb-2 [&_h3]:mb-2 [&_h1:first-child]:mt-0 [&_pre]:bg-neutral-800 [&_pre]:dark:bg-neutral-700 [&_pre]:text-amber-50 [&_pre]:dark:text-neutral-200 [&_pre]:p-4 [&_pre]:rounded-lg [&_pre]:overflow-x-auto [&_pre]:text-sm [&_code]:font-mono [&_code]:text-[0.9em] [&_p]:my-2 [&_ul]:my-2 [&_ol]:my-2 [&_ul]:pl-6 [&_ol]:pl-6 [&_a]:text-accent [&_a]:dark:text-amber-400';

      function renderDetail(question) {
        const navBar = document.getElementById('navBar');
        const navPosition = document.getElementById('navPosition');
        if (!question) {
          if (navBar) navBar.classList.add('hidden');
          currentQuestionId = null;
          detailEl.innerHTML = '<div class="text-muted dark:text-neutral-400 italic py-8">Select a question from the sidebar.</div>';
          try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
          return;
        }
        currentQuestionId = question.uniqueId;
        try { history.replaceState(null, '', window.location.pathname + window.location.search + '#' + question.uniqueId); } catch (e) {}
        const idx = orderedQuestionIds.indexOf(question.uniqueId);
        if (navBar) {
          navBar.classList.remove('hidden');
          navBar.classList.add('flex');
        }
        if (navPosition) navPosition.textContent = (idx >= 0 ? idx + 1 : 0) + ' / ' + orderedQuestionIds.length;

        const ancestorNames = (question.ancestors || []).map(function (a) { return a.name; }).filter(Boolean);
        const breadcrumb = ancestorNames.length ? ancestorNames.join(' › ') + ' › ' + (question.name || '') : (question.name || '');
        const questionBody = renderSmartContent(question.smartContent);
        let answersHtml = '';
        (question.answers || []).forEach(function (ans, idx) {
          const ansBody = renderSmartContent(ans.smartContent);
          const rating = ans.rating != null ? '<span class="text-xs text-muted dark:text-neutral-400">Rating: ' + escapeHtml(String(ans.rating)) + '</span>' : '';
          const heading = ans.heading || ans.name || ('Answer ' + (idx + 1));
          answersHtml += '<div class="border border-border dark:border-neutral-600 rounded-lg p-3 sm:p-4 mb-4 bg-panel dark:bg-neutral-800 shadow-sm">' +
            '<h3 class="font-serif text-lg m-0 mb-2 text-neutral-800 dark:text-neutral-100">' + escapeHtml(heading) + '</h3>' +
            (rating ? '<div class="text-xs text-muted dark:text-neutral-400 mb-2">' + rating + '</div>' : '') +
            '<div class="' + contentBlockClasses + ' answer-body">' + ansBody + '</div></div>';
        });
        const qRating = question.rating != null ? '<p class="text-xs text-muted dark:text-neutral-400 mb-2">Rating: ' + escapeHtml(String(question.rating)) + '</p>' : '';
        detailEl.innerHTML =
          '<div class="text-[0.8125rem] text-muted dark:text-neutral-400 mb-2">' + escapeHtml(breadcrumb) + '</div>' +
          '<h2 class="font-serif text-xl sm:text-2xl font-normal m-0 mb-3 text-neutral-800 dark:text-neutral-100">' + escapeHtml(question.name || question.heading || 'Untitled') + '</h2>' +
          qRating +
          '<div class="' + contentBlockClasses + ' question-body">' + questionBody + '</div>' +
          (answersHtml ? '<div class="answers mt-6">' + answersHtml + '</div>' : '');
        if (typeof hljs !== 'undefined') {
          detailEl.querySelectorAll('pre code').forEach(function (el) { hljs.highlightElement(el); });
        }
        syncSidebarToCurrent();
      }

      function syncSidebarToCurrent() {
        if (!currentQuestionId) return;
        treeContainer.querySelectorAll('.tree-toggle').forEach(function (b) { b.removeAttribute('aria-current'); });
        const li = treeContainer.querySelector('li[data-id="' + currentQuestionId + '"]');
        if (!li) return;
        const btn = li.querySelector('.tree-toggle');
        if (btn) btn.setAttribute('aria-current', 'true');
        let el = li.parentElement;
        while (el && el !== treeContainer) {
          if (el.tagName === 'UL') {
            el.hidden = false;
            const prev = el.previousElementSibling;
            if (prev && prev.classList.contains('tree-toggle')) {
              prev.setAttribute('aria-expanded', 'true');
              const ch = prev.querySelector('.chevron');
              if (ch) ch.classList.add('rotate-90');
            }
          }
          el = el.parentElement;
        }
      }

      function goToByIndex(index) {
        if (orderedQuestionIds.length === 0) return;
        const id = orderedQuestionIds[index];
        const question = questionById.get(id);
        if (question) {
          renderDetail(question);
          if (isMobile()) closeSidebar();
        }
      }

      function goToPrev() {
        if (orderedQuestionIds.length === 0) return;
        const idx = orderedQuestionIds.indexOf(currentQuestionId);
        const current = idx >= 0 ? idx : 0;
        const next = (current - 1 + orderedQuestionIds.length) % orderedQuestionIds.length;
        goToByIndex(next);
      }

      function goToNext() {
        if (orderedQuestionIds.length === 0) return;
        const idx = orderedQuestionIds.indexOf(currentQuestionId);
        const current = idx >= 0 ? idx : 0;
        const next = (current + 1) % orderedQuestionIds.length;
        goToByIndex(next);
      }

      function questionMatches(q, filter) {
        if (!filter) return true;
        return (q.name || '').toLowerCase().includes(filter.toLowerCase()) ||
          (q.heading || '').toLowerCase().includes(filter.toLowerCase());
      }

      function hasMatchingDescendant(questionId, filter) {
        if (!filter) return true;
        const q = questionById.get(questionId);
        if (!q) return false;
        if (questionMatches(q, filter)) return true;
        const kids = childrenByParentId.get(questionId) || [];
        return kids.some(function (k) { return hasMatchingDescendant(k.uniqueId, filter); });
      }

      function treeItem(question, depth, filter) {
        const kids = childrenByParentId.get(question.uniqueId) || [];
        const match = questionMatches(question, filter);
        const childrenFiltered = filter
          ? kids.filter(function (t) { return questionMatches(t, filter) || hasMatchingDescendant(t.uniqueId, filter); })
          : kids;
        const hasVisibleChildren = childrenFiltered.length > 0;
        const id = 'q-' + question.uniqueId;
        const isOpen = depth === 0 || match || hasVisibleChildren;

        let childLis = '';
        if (hasVisibleChildren) {
          childLis = '<ul class="list-none m-0 pl-4 [&_.tree-toggle]:pl-2 [&_ul_.tree-toggle]:text-[0.9375rem]">' +
            childrenFiltered.map(function (c) { return treeItem(c, depth + 1, filter); }).join('') +
            '</ul>';
        }

        return '<li class="m-0" data-id="' + escapeHtml(question.uniqueId) + '">' +
          '<button type="button" class="tree-toggle flex items-center gap-1 min-w-0 py-1.5 px-3 cursor-pointer border-0 bg-transparent w-full text-left font-inherit text-neutral-800 dark:text-neutral-200 hover:bg-hover dark:hover:bg-neutral-700" id="' + id + '" aria-expanded="' + isOpen + '" data-id="' + escapeHtml(question.uniqueId) + '">' +
          (hasVisibleChildren ? '<span class="chevron w-[18px] shrink-0 opacity-60 transition-transform ' + (isOpen ? 'rotate-90' : '') + '">▶</span>' : '<span class="w-[18px] shrink-0" aria-hidden="true"></span>') +
          '<span class="min-w-0 truncate" title="' + escapeHtml((question.name || question.heading || 'Untitled').replace(/"/g, '&quot;')) + '">' + escapeHtml(question.name || question.heading || 'Untitled') + '</span></button>' +
          childLis + '</li>';
      }

      function renderTree(filter) {
        const roots = childrenByParentId.get('__root') || [];
        const filtered = filter
          ? roots.filter(function (t) { return questionMatches(t, filter) || hasMatchingDescendant(t.uniqueId, filter); })
          : roots;
        treeContainer.innerHTML = '<ul class="list-none m-0 p-0">' +
          filtered.map(function (t) { return treeItem(t, 0, filter); }).join('') + '</ul>';

        treeContainer.querySelectorAll('.tree-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-id');
            const question = questionById.get(id);
            if (question) {
              treeContainer.querySelectorAll('.tree-toggle').forEach(function (b) { b.removeAttribute('aria-current'); });
              btn.setAttribute('aria-current', 'true');
              const li = btn.closest('li');
              const childList = li.querySelector(':scope > ul');
              if (childList) {
                const open = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !open);
                const chev = btn.querySelector('.chevron');
                if (chev) chev.classList.toggle('rotate-90', !open);
                childList.hidden = open;
              }
              renderDetail(question);
              if (isMobile()) closeSidebar();
            }
          });
        });

        treeContainer.querySelectorAll('li > ul').forEach(function (ul) {
          const btn = ul.previousElementSibling;
          const open = btn && btn.getAttribute('aria-expanded') === 'true';
          ul.hidden = !open;
        });
        syncSidebarToCurrent();
      }

      function run(data) {
        if (!Array.isArray(data)) {
          statusEl.textContent = 'Invalid data: expected an array.';
          treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Invalid JSON structure.</div>';
          return;
        }
        questions = data;
        buildIndex();
        statusEl.textContent = questions.length + ' questions loaded.';
        renderTree(searchInput.value.trim());
        var hashId = (location.hash || '').replace(/^#/, '').trim();
        if (hashId && questionById.get(hashId)) {
          renderDetail(questionById.get(hashId));
        }
      }

      function loadFromUrl() {
        fetch('data/interview-questions-export-flat.json')
          .then(function (r) { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(run)
          .catch(function (err) {
            statusEl.textContent = 'Load failed.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Could not load <code>data/interview-questions-export-flat.json</code>. Serve this folder with a local server (e.g. <code>npm start</code>) or use "Load from file".</div>';
            console.error(err);
          });
      }

      fileInput.addEventListener('change', function () {
        const f = fileInput.files[0];
        if (!f) return;
        statusEl.textContent = 'Loading…';
        const r = new FileReader();
        r.onload = function () {
          try { run(JSON.parse(r.result)); }
          catch (e) {
            statusEl.textContent = 'Parse error.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Invalid JSON.</div>';
          }
        };
        r.readAsText(f);
      });

      searchInput.addEventListener('input', function () {
        if (questions.length) renderTree(searchInput.value.trim());
      });

      document.getElementById('prevBtn').addEventListener('click', goToPrev);
      document.getElementById('nextBtn').addEventListener('click', goToNext);

      window.addEventListener('hashchange', function () {
        var hashId = (location.hash || '').replace(/^#/, '').trim();
        if (!hashId || !questionById.get(hashId)) return;
        if (hashId === currentQuestionId) return;
        renderDetail(questionById.get(hashId));
      });

      loadFromUrl();
    })();
  </script>
</body>
</html>
