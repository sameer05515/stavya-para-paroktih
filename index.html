<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Browser — Stavya Para Paroktih</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"DM Serif Display"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          colors: {
            surface: '#faf9f6',
            panel: '#fff',
            border: '#e8e4de',
            muted: '#6b6560',
            accent: '#8b6914',
            'accent-bg': '#f5eed9',
            hover: '#ebe6df',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    .tree-toggle[aria-current="true"] { background-color: #f5eed9; color: #8b6914; font-weight: 600; }
    @media (max-width: 767px) {
      .sidebar-open .sidebar-drawer { transform: translateX(0); }
      .sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-surface text-neutral-800 text-[15px] leading-relaxed font-sans">
  <header class="shrink-0 py-3 px-4 sm:px-5 bg-panel border-b border-border flex flex-wrap items-center gap-3 sm:gap-4">
    <div class="flex items-center gap-2 min-w-0 flex-1 sm:flex-initial">
      <button type="button" id="sidebarToggle" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-hover border-0 bg-transparent cursor-pointer text-neutral-800" aria-label="Toggle topics menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="font-serif text-lg sm:text-xl font-normal m-0 text-neutral-800 truncate">Topics Browser</h1>
    </div>
    <div class="w-full sm:w-auto sm:flex-1 sm:min-w-0 sm:max-w-[320px] order-3 sm:order-none">
      <input type="text" id="search" placeholder="Search topics…" class="w-full py-2 px-3 border border-border rounded-lg bg-surface placeholder:text-muted focus:outline-none focus:border-accent focus:bg-panel font-sans text-base" />
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <label class="py-2 px-3 font-sans cursor-pointer bg-accent-bg text-accent border border-amber-800/30 rounded-lg hover:bg-amber-100 text-sm whitespace-nowrap">
        <input type="file" id="fileInput" accept=".json" class="hidden" />
        Load from file
      </label>
      <span class="text-xs sm:text-sm text-muted shrink-0" id="status">Loading…</span>
    </div>
  </header>

  <div class="fixed inset-0 z-30 bg-black/30 opacity-0 pointer-events-none transition-opacity md:hidden sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <main class="flex-1 flex min-h-0 relative">
    <aside id="sidebar" class="sidebar-drawer fixed md:relative inset-y-0 left-0 z-40 w-[280px] min-h-0 pt-14 md:pt-2 pb-2 -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out shrink-0 bg-panel border-r border-border overflow-y-auto" aria-label="Topics">
      <div id="treeContainer" class="py-2"></div>
    </aside>
    <article class="flex-1 min-w-0 overflow-y-auto py-4 px-4 sm:py-6 sm:px-6 md:px-8 pb-8">
      <div id="detail"></div>
    </article>
  </main>

  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const treeContainer = document.getElementById('treeContainer');
      const detailEl = document.getElementById('detail');
      const searchInput = document.getElementById('search');
      const fileInput = document.getElementById('fileInput');
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');

      function isMobile() { return window.matchMedia('(max-width: 767px)').matches; }
      function sidebarOpen() { return document.body.classList.contains('sidebar-open'); }
      function openSidebar() { document.body.classList.add('sidebar-open'); }
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }
      function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

      if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
      if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

      let topics = [];
      let topicById = new Map();
      let childrenByParentId = new Map();

      function buildIndex() {
        topicById.clear();
        childrenByParentId.clear();
        topics.forEach(t => {
          topicById.set(t.uniqueId, t);
          const pid = t.parentId || '__root';
          if (!childrenByParentId.has(pid)) childrenByParentId.set(pid, []);
          childrenByParentId.get(pid).push(t);
        });
        childrenByParentId.forEach(list => list.sort((a, b) => (a.name || '').localeCompare(b.name || '')));
      }

      function renderContent(html) {
        if (!html || !html.trim()) return '';
        return html;
      }

      function renderMarkdown(md) {
        if (!md || !md.trim()) return '';
        if (typeof marked !== 'undefined') {
          try { return marked.parse(md); } catch (e) { return md; }
        }
        return '<pre>' + escapeHtml(md) + '</pre>';
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      const contentBlockClasses = 'mb-6 empty:hidden break-words [&_h1]:font-serif [&_h2]:font-serif [&_h3]:font-serif [&_h1]:font-normal [&_h2]:font-normal [&_h3]:font-normal [&_h1]:mt-4 [&_h2]:mt-4 [&_h3]:mt-4 [&_h1]:mb-2 [&_h2]:mb-2 [&_h3]:mb-2 [&_h1:first-child]:mt-0 [&_pre]:bg-neutral-800 [&_pre]:text-amber-50 [&_pre]:p-4 [&_pre]:rounded-lg [&_pre]:overflow-x-auto [&_pre]:text-sm [&_code]:font-mono [&_code]:text-[0.9em] [&_p]:my-2 [&_ul]:my-2 [&_ol]:my-2 [&_ul]:pl-6 [&_ol]:pl-6 [&_a]:text-accent';

      function renderTopicContent(smartContent) {
        if (!smartContent || !smartContent.content) return '';
        const type = (smartContent.textOutputType || '').toLowerCase();
        return type === 'markdown' ? renderMarkdown(smartContent.content) : renderContent(smartContent.content);
      }

      function renderDetail(topic) {
        if (!topic) {
          detailEl.innerHTML = '<div class="text-muted italic py-8">Select a topic from the sidebar.</div>';
          return;
        }
        const ancestorNames = (topic.ancestors || []).map(a => a.name).filter(Boolean);
        const breadcrumb = ancestorNames.length ? ancestorNames.join(' › ') + ' › ' + (topic.name || '') : (topic.name || '');
        const bodyHtml = renderTopicContent(topic.smartContent);
        let sectionsHtml = '';
        (topic.sections || []).forEach(sec => {
          const secBody = renderTopicContent(sec.smartContent);
          const meta = [sec.createdDate, sec.updatedDate].filter(Boolean).map(d => new Date(d).toLocaleDateString()).join(' · ');
          sectionsHtml += `
            <div class="border border-border rounded-lg p-3 sm:p-4 mb-4 bg-panel shadow-sm">
              <h3 class="font-serif text-lg m-0 mb-2">${escapeHtml(sec.name || 'Section')}</h3>
              ${meta ? `<div class="text-xs text-muted mb-2">${escapeHtml(meta)}</div>` : ''}
              <div class="${contentBlockClasses} section-body">${secBody}</div>
            </div>`;
        });
        detailEl.innerHTML = `
          <div class="text-[0.8125rem] text-muted mb-2">${escapeHtml(breadcrumb)}</div>
          <h2 class="font-serif text-xl sm:text-2xl font-normal m-0 mb-3 text-neutral-800">${escapeHtml(topic.name || 'Untitled')}</h2>
          ${topic.description ? `<p class="text-xs text-muted mb-5">${escapeHtml(topic.description)}</p>` : ''}
          <div class="${contentBlockClasses} topic-body">${bodyHtml}</div>
          ${sectionsHtml ? '<div class="sections">' + sectionsHtml + '</div>' : ''}
        `;
      }

      function treeItem(topic, depth, filter) {
        const kids = childrenByParentId.get(topic.uniqueId) || [];
        const name = (topic.name || '').toLowerCase();
        const match = !filter || name.includes(filter.toLowerCase());
        const childrenFiltered = filter ? kids.filter(t => (t.name || '').toLowerCase().includes(filter.toLowerCase())) : kids;
        const hasVisibleChildren = childrenFiltered.length > 0;
        const id = 'topic-' + topic.uniqueId;
        const isOpen = depth === 0 || match || hasVisibleChildren;

        let childLis = '';
        if (hasVisibleChildren) {
          childLis = '<ul class="list-none m-0 pl-4 [&_.tree-toggle]:pl-2 [&_ul_.tree-toggle]:text-[0.9375rem]">' +
            childrenFiltered.map(c => treeItem(c, depth + 1, filter)).join('') +
            '</ul>';
        }

        return `
          <li class="m-0" data-id="${escapeHtml(topic.uniqueId)}">
            <button type="button" class="tree-toggle flex items-center gap-1 py-1.5 px-3 cursor-pointer border-0 bg-transparent w-full text-left font-inherit text-neutral-800 hover:bg-hover" id="${id}" aria-expanded="${isOpen}" data-id="${escapeHtml(topic.uniqueId)}">
              <span class="chevron w-[18px] shrink-0 opacity-60 transition-transform ${hasVisibleChildren ? (isOpen ? 'rotate-90' : '') : 'opacity-20'}">▶</span>
              <span>${escapeHtml(topic.name || 'Untitled')}</span>
            </button>
            ${childLis}
          </li>`;
      }

      function renderTree(filter) {
        const roots = (childrenByParentId.get('__root') || []);
        const filtered = filter ? roots.filter(t => (t.name || '').toLowerCase().includes(filter.toLowerCase())) : roots;
        treeContainer.innerHTML = '<ul class="list-none m-0 p-0">' +
          filtered.map(t => treeItem(t, 0, filter)).join('') +
          '</ul>';

        treeContainer.querySelectorAll('.tree-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const topic = topicById.get(id);
            if (topic) {
              treeContainer.querySelectorAll('.tree-toggle').forEach(b => { b.removeAttribute('aria-current'); });
              btn.setAttribute('aria-current', 'true');
              const li = btn.closest('li');
              const childList = li.querySelector(':scope > ul');
              if (childList) {
                const open = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !open);
                const chev = btn.querySelector('.chevron');
                if (chev && !chev.classList.contains('opacity-20')) chev.classList.toggle('rotate-90', !open);
                childList.hidden = open;
              }
              renderDetail(topic);
              if (isMobile()) closeSidebar();
            }
          });
        });

        treeContainer.querySelectorAll('li > ul').forEach(ul => {
          const btn = ul.previousElementSibling;
          const open = btn && btn.getAttribute('aria-expanded') === 'true';
          ul.hidden = !open;
        });
      }

      function run(data) {
        if (!Array.isArray(data)) {
          statusEl.textContent = 'Invalid data: expected an array.';
          treeContainer.innerHTML = '<div class="py-8 text-center text-red-800">Invalid JSON structure.</div>';
          return;
        }
        topics = data;
        buildIndex();
        statusEl.textContent = topics.length + ' topics loaded.';
        renderTree(searchInput.value.trim());
      }

      function loadFromUrl() {
        fetch('data/topics-export-flat.json')
          .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(run)
          .catch(err => {
            statusEl.textContent = 'Load failed.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800">Could not load <code>data/topics-export-flat.json</code>. Serve this folder with a local server (e.g. <code>npm start</code>) or use "Load from file".</div>';
            console.error(err);
          });
      }

      fileInput.addEventListener('change', () => {
        const f = fileInput.files[0];
        if (!f) return;
        statusEl.textContent = 'Loading…';
        const r = new FileReader();
        r.onload = () => {
          try {
            run(JSON.parse(r.result));
          } catch (e) {
            statusEl.textContent = 'Parse error.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800">Invalid JSON.</div>';
          }
        };
        r.readAsText(f);
      });

      searchInput.addEventListener('input', () => {
        if (topics.length) renderTree(searchInput.value.trim());
      });

      loadFromUrl();
    })();
  </script>
</body>
</html>
