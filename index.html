<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Browser — Stavya Para Paroktih</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf9f6;
      --panel: #fff;
      --border: #e8e4de;
      --text: #2c2825;
      --muted: #6b6560;
      --accent: #8b6914;
      --accent-bg: #f5eed9;
      --hover: #ebe6df;
      --radius: 8px;
      --shadow: 0 2px 12px rgba(44, 40, 37, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .header {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      margin: 0;
      color: var(--text);
    }
    .search-wrap {
      flex: 1;
      max-width: 320px;
    }
    .search-wrap input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      background: var(--bg);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--panel);
    }
    .load-file {
      padding: 0.5rem 0.75rem;
      font: inherit;
      cursor: pointer;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(139, 105, 20, 0.3);
      border-radius: var(--radius);
    }
    .load-file:hover { background: #ede4c4; }
    .load-file input[type="file"] { display: none; }
    .status {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .tree-root { list-style: none; margin: 0; padding: 0; }
    .tree-item { margin: 0; }
    .tree-item > .tree-toggle {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font: inherit;
      color: var(--text);
    }
    .tree-toggle:hover { background: var(--hover); }
    .tree-toggle.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
    .tree-toggle .chevron {
      width: 18px;
      flex-shrink: 0;
      opacity: 0.6;
      transition: transform 0.2s;
    }
    .tree-toggle .chevron.open { transform: rotate(90deg); }
    .tree-toggle .chevron.empty { opacity: 0.2; }
    .tree-children { list-style: none; margin: 0; padding-left: 1rem; }
    .tree-children .tree-toggle { padding-left: 0.5rem; }
    .tree-children .tree-children .tree-toggle { font-size: 0.9375rem; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 2rem;
    }
    .content .empty {
      color: var(--muted);
      font-style: italic;
      padding: 2rem;
    }
    .breadcrumb {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .breadcrumb span + span::before { content: ' › '; }
    .content h2 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      margin: 0 0 0.75rem;
      color: var(--text);
    }
    .topic-meta {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .topic-body, .section-body {
      margin-bottom: 1.5rem;
    }
    .topic-body:empty, .section-body:empty { display: none; }
    .topic-body h1, .topic-body h2, .topic-body h3,
    .section-body h1, .section-body h2, .section-body h3 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      margin: 1rem 0 0.5rem;
    }
    .topic-body h1:first-child, .section-body h1:first-child { margin-top: 0; }
    .topic-body pre, .section-body pre {
      background: #2c2825;
      color: #e8e4de;
      padding: 1rem;
      border-radius: var(--radius);
      overflow-x: auto;
      font-size: 0.875rem;
    }
    .topic-body code, .section-body code {
      font-family: ui-monospace, monospace;
      font-size: 0.9em;
    }
    .topic-body p, .section-body p { margin: 0.5rem 0; }
    .topic-body ul, .topic-body ol, .section-body ul, .section-body ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .topic-body a, .section-body a { color: var(--accent); }
    .section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .section h3 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.15rem;
      margin: 0 0 0.5rem;
    }
    .section-meta { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.5rem; }
    .loading, .error {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
    .error { color: #a52a2a; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Topics Browser</h1>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search topics…" />
    </div>
    <label class="load-file">
      <input type="file" id="fileInput" accept=".json" />
      Load from file
    </label>
    <span class="status" id="status">Loading…</span>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div id="treeContainer"></div>
    </aside>
    <article class="content">
      <div id="detail"></div>
    </article>
  </main>

  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const treeContainer = document.getElementById('treeContainer');
      const detailEl = document.getElementById('detail');
      const searchInput = document.getElementById('search');
      const fileInput = document.getElementById('fileInput');

      let topics = [];
      let topicById = new Map();
      let childrenByParentId = new Map();

      function buildIndex() {
        topicById.clear();
        childrenByParentId.clear();
        topics.forEach(t => {
          topicById.set(t.uniqueId, t);
          const pid = t.parentId || '__root';
          if (!childrenByParentId.has(pid)) childrenByParentId.set(pid, []);
          childrenByParentId.get(pid).push(t);
        });
        childrenByParentId.forEach(list => list.sort((a, b) => (a.name || '').localeCompare(b.name || '')));
      }

      function renderContent(html) {
        if (!html || !html.trim()) return '';
        return html;
      }

      function renderMarkdown(md) {
        if (!md || !md.trim()) return '';
        if (typeof marked !== 'undefined') {
          try { return marked.parse(md); } catch (e) { return md; }
        }
        return '<pre>' + escapeHtml(md) + '</pre>';
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function renderTopicContent(smartContent) {
        if (!smartContent || !smartContent.content) return '';
        const type = (smartContent.textOutputType || '').toLowerCase();
        return type === 'markdown' ? renderMarkdown(smartContent.content) : renderContent(smartContent.content);
      }

      function renderDetail(topic) {
        if (!topic) {
          detailEl.innerHTML = '<div class="empty">Select a topic from the sidebar.</div>';
          return;
        }
        const ancestorNames = (topic.ancestors || []).map(a => a.name).filter(Boolean);
        const breadcrumb = ancestorNames.length ? ancestorNames.join(' › ') + ' › ' + (topic.name || '') : (topic.name || '');
        const bodyHtml = renderTopicContent(topic.smartContent);
        let sectionsHtml = '';
        (topic.sections || []).forEach(sec => {
          const secBody = renderTopicContent(sec.smartContent);
          const meta = [sec.createdDate, sec.updatedDate].filter(Boolean).map(d => new Date(d).toLocaleDateString()).join(' · ');
          sectionsHtml += `
            <div class="section">
              <h3>${escapeHtml(sec.name || 'Section')}</h3>
              ${meta ? `<div class="section-meta">${escapeHtml(meta)}</div>` : ''}
              <div class="section-body">${secBody}</div>
            </div>`;
        });
        detailEl.innerHTML = `
          <div class="breadcrumb">${escapeHtml(breadcrumb)}</div>
          <h2>${escapeHtml(topic.name || 'Untitled')}</h2>
          ${topic.description ? `<p class="topic-meta">${escapeHtml(topic.description)}</p>` : ''}
          <div class="topic-body">${bodyHtml}</div>
          ${sectionsHtml ? '<div class="sections">' + sectionsHtml + '</div>' : ''}
        `;
      }

      function treeItem(topic, depth, filter) {
        const kids = childrenByParentId.get(topic.uniqueId) || [];
        const name = (topic.name || '').toLowerCase();
        const match = !filter || name.includes(filter.toLowerCase());
        const childrenFiltered = filter ? kids.filter(t => (t.name || '').toLowerCase().includes(filter.toLowerCase())) : kids;
        const hasVisibleChildren = childrenFiltered.length > 0;
        const id = 'topic-' + topic.uniqueId;
        const isOpen = depth === 0 || match || hasVisibleChildren;

        let childLis = '';
        if (hasVisibleChildren) {
          childLis = '<ul class="tree-children">' +
            childrenFiltered.map(c => treeItem(c, depth + 1, filter)).join('') +
            '</ul>';
        }

        return `
          <li class="tree-item" data-id="${escapeHtml(topic.uniqueId)}">
            <button type="button" class="tree-toggle" id="${id}" aria-expanded="${isOpen}" data-id="${escapeHtml(topic.uniqueId)}">
              <span class="chevron ${hasVisibleChildren ? (isOpen ? 'open' : '') : 'empty'}">▶</span>
              <span>${escapeHtml(topic.name || 'Untitled')}</span>
            </button>
            ${childLis}
          </li>`;
      }

      function renderTree(filter) {
        const roots = (childrenByParentId.get('__root') || []);
        const filtered = filter ? roots.filter(t => (t.name || '').toLowerCase().includes(filter.toLowerCase())) : roots;
        treeContainer.innerHTML = '<ul class="tree-root">' +
          filtered.map(t => treeItem(t, 0, filter)).join('') +
          '</ul>';

        treeContainer.querySelectorAll('.tree-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const topic = topicById.get(id);
            if (topic) {
              treeContainer.querySelectorAll('.tree-toggle').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              const li = btn.closest('.tree-item');
              const childList = li.querySelector(':scope > .tree-children');
              if (childList) {
                const open = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !open);
                btn.querySelector('.chevron:not(.empty)')?.classList.toggle('open', !open);
                childList.hidden = open;
              }
              renderDetail(topic);
            }
          });
        });

        treeContainer.querySelectorAll('.tree-children').forEach(ul => {
          const btn = ul.previousElementSibling;
          const open = btn && btn.getAttribute('aria-expanded') === 'true';
          ul.hidden = !open;
        });
      }

      function run(data) {
        if (!Array.isArray(data)) {
          statusEl.textContent = 'Invalid data: expected an array.';
          treeContainer.innerHTML = '<div class="error">Invalid JSON structure.</div>';
          return;
        }
        topics = data;
        buildIndex();
        statusEl.textContent = topics.length + ' topics loaded.';
        renderTree(searchInput.value.trim());
      }

      function loadFromUrl() {
        fetch('data/topics-export-flat.json')
          .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(run)
          .catch(err => {
            statusEl.textContent = 'Load failed.';
            treeContainer.innerHTML = '<div class="error">Could not load <code>data/topics-export-flat.json</code>. Serve this folder with a local server (e.g. <code>npx serve .</code>) or use "Load from file".</div>';
            console.error(err);
          });
      }

      fileInput.addEventListener('change', () => {
        const f = fileInput.files[0];
        if (!f) return;
        statusEl.textContent = 'Loading…';
        const r = new FileReader();
        r.onload = () => {
          try {
            run(JSON.parse(r.result));
          } catch (e) {
            statusEl.textContent = 'Parse error.';
            treeContainer.innerHTML = '<div class="error">Invalid JSON.</div>';
          }
        };
        r.readAsText(f);
      });

      searchInput.addEventListener('input', () => {
        if (topics.length) renderTree(searchInput.value.trim());
      });

      loadFromUrl();
    })();
  </script>
</body>
</html>
