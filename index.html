<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Browser — Stavya Para Paroktih</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"DM Serif Display"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          colors: {
            surface: '#faf9f6',
            panel: '#fff',
            border: '#e8e4de',
            muted: '#6b6560',
            accent: '#8b6914',
            'accent-bg': '#f5eed9',
            hover: '#ebe6df',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    .tree-toggle[aria-current="true"] { background-color: #f5eed9; color: #8b6914; font-weight: 600; }
    .dark .tree-toggle[aria-current="true"] { background-color: rgb(120 53 15 / 0.4); color: #fbbf24; }
    @media (max-width: 767px) {
      .sidebar-open .sidebar-drawer { transform: translateX(0); }
      .sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
    }
    @media (min-width: 768px) {
      .sidebar-collapsed .sidebar-drawer { width: 0; min-width: 0; overflow: hidden; padding: 0; border-right-width: 0; transform: none; }
      .sidebar-collapsed .sidebar-drawer .sidebar-content { opacity: 0; pointer-events: none; }
    }
    .codeblock { position: relative; }
    .codeblock-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(17, 24, 39, 0.55);
      color: rgba(255,255,255,0.92);
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(6px);
    }
    .codeblock-copy:hover { background: rgba(17, 24, 39, 0.72); }
    .codeblock-copy:active { transform: translateY(1px); }
    .dark .codeblock-copy { border-color: rgba(255,255,255,0.20); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col bg-surface dark:bg-neutral-900 text-neutral-800 dark:text-neutral-200 text-base leading-relaxed font-sans">
  <header class="shrink-0 py-3 px-4 sm:px-5 bg-panel dark:bg-neutral-800 border-b border-border dark:border-neutral-700 flex flex-wrap items-center gap-3 sm:gap-4">
    <div class="flex items-center gap-2 min-w-0 flex-1 sm:flex-initial">
      <button type="button" id="sidebarToggle" class="p-2 -ml-2 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border-0 bg-transparent cursor-pointer text-neutral-800 dark:text-neutral-200" aria-label="Show/hide sidebar">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="font-serif text-lg sm:text-xl font-normal m-0 text-neutral-800 dark:text-neutral-100 truncate">Topics Browser</h1>
    </div>
    <div class="w-full sm:w-auto sm:flex-1 sm:min-w-0 sm:max-w-[320px] order-3 sm:order-none">
      <input type="text" id="search" placeholder="Search topics…" class="w-full py-2 px-3 border border-border dark:border-neutral-600 rounded-lg bg-surface dark:bg-neutral-800 placeholder:text-muted dark:placeholder:text-neutral-400 focus:outline-none focus:border-accent dark:focus:border-amber-500 focus:bg-panel dark:focus:bg-neutral-800 font-sans text-base text-neutral-800 dark:text-neutral-200" />
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" id="themeToggle" class="p-2 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border-0 bg-transparent cursor-pointer text-neutral-700 dark:text-neutral-300 focus:outline-none focus:ring-2 focus:ring-accent dark:focus:ring-amber-500 focus:ring-offset-2 dark:focus:ring-offset-neutral-900" aria-label="Toggle light/dark theme">
        <span id="themeIconLight" class="hidden dark:block"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></span>
        <span id="themeIconDark" class="block dark:hidden"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></span>
      </button>
      <label class="py-2 px-3 font-sans cursor-pointer bg-accent-bg dark:bg-amber-900/40 text-accent dark:text-amber-400 border border-amber-800/30 dark:border-amber-700/50 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900/60 text-sm whitespace-nowrap">
        <input type="file" id="fileInput" accept=".json" class="hidden" />
        Load from file
      </label>
      <span class="text-xs sm:text-sm text-muted dark:text-neutral-400 shrink-0" id="status">Loading…</span>
    </div>
  </header>

  <div class="fixed inset-0 z-30 bg-black/30 dark:bg-black/50 opacity-0 pointer-events-none transition-opacity md:hidden sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <main class="flex-1 flex min-h-0 relative">
    <aside id="sidebar" class="sidebar-drawer fixed md:relative inset-y-0 left-0 z-40 w-[280px] min-h-0 pt-14 md:pt-2 pb-2 -translate-x-full md:translate-x-0 transition-all duration-200 ease-out shrink-0 bg-panel dark:bg-neutral-800 border-r border-border dark:border-neutral-700 flex flex-col overflow-hidden" aria-label="Topics">
      <div id="treeContainer" class="sidebar-content py-2 overflow-y-auto min-h-0 flex-1"></div>
    </aside>
    <article class="flex-1 min-w-0 overflow-y-auto py-4 px-4 sm:py-6 sm:px-6 md:px-8 pb-8 bg-surface dark:bg-neutral-900">
      <div id="navBar" class="hidden flex items-center justify-between gap-4 mb-4 pb-3 border-b border-border dark:border-neutral-700">
        <button type="button" id="prevBtn" class="flex items-center gap-1.5 py-2 px-3 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border border-border dark:border-neutral-600 text-neutral-800 dark:text-neutral-200 font-medium text-sm cursor-pointer" aria-label="Previous topic">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Prev
        </button>
        <span id="navPosition" class="text-sm text-muted dark:text-neutral-400 tabular-nums"></span>
        <button type="button" id="nextBtn" class="flex items-center gap-1.5 py-2 px-3 rounded-lg hover:bg-hover dark:hover:bg-neutral-700 border border-border dark:border-neutral-600 text-neutral-800 dark:text-neutral-200 font-medium text-sm cursor-pointer" aria-label="Next topic">
          Next
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="detail"></div>
    </article>
  </main>

  <script>
    (function () {
      if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
        marked.setOptions({
          highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
            }
            try { return hljs.highlightAuto(code).value; } catch (e) { return code; }
          }
        });
      }

      const statusEl = document.getElementById('status');
      const treeContainer = document.getElementById('treeContainer');
      const detailEl = document.getElementById('detail');
      const searchInput = document.getElementById('search');
      const fileInput = document.getElementById('fileInput');
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');

      function isMobile() { return window.matchMedia('(max-width: 767px)').matches; }
      function sidebarOpen() { return document.body.classList.contains('sidebar-open'); }
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }
      function isSidebarCollapsed() { return document.body.classList.contains('sidebar-collapsed'); }
      function setSidebarCollapsed(collapsed) {
        if (collapsed) document.body.classList.add('sidebar-collapsed');
        else document.body.classList.remove('sidebar-collapsed');
        try { localStorage.setItem('sidebarCollapsed', collapsed ? 'true' : 'false'); } catch (e) {}
      }
      function toggleSidebar() {
        if (isMobile()) {
          document.body.classList.toggle('sidebar-open');
        } else {
          setSidebarCollapsed(!isSidebarCollapsed());
        }
      }
      (function initSidebarState() {
        if (isMobile()) return;
        try {
          if (localStorage.getItem('sidebarCollapsed') === 'true') document.body.classList.add('sidebar-collapsed');
        } catch (e) {}
      })();

      if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
      if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

      function getTheme() {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') return t;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function setTheme(theme) {
        localStorage.setItem('theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }
      document.getElementById('themeToggle').addEventListener('click', function() {
        setTheme(getTheme() === 'dark' ? 'light' : 'dark');
      });

      let topics = [];
      let topicById = new Map();
      let childrenByParentId = new Map();
      let orderedTopicIds = [];
      let currentTopicId = null;

      function buildOrderedList() {
        orderedTopicIds = [];
        function visit(t) {
          orderedTopicIds.push(t.uniqueId);
          (childrenByParentId.get(t.uniqueId) || []).forEach(visit);
        }
        (childrenByParentId.get('__root') || []).forEach(visit);
      }

      function buildIndex() {
        topicById.clear();
        childrenByParentId.clear();
        topics.forEach(t => {
          topicById.set(t.uniqueId, t);
          const pid = t.parentId || '__root';
          if (!childrenByParentId.has(pid)) childrenByParentId.set(pid, []);
          childrenByParentId.get(pid).push(t);
        });
        childrenByParentId.forEach(list => list.sort((a, b) => (a.name || '').localeCompare(b.name || '')));
        buildOrderedList();
      }

      function renderContent(html) {
        if (!html || !html.trim()) return '';
        return html;
      }

      function renderMarkdown(md) {
        if (!md || !md.trim()) return '';
        if (typeof marked !== 'undefined') {
          try { return marked.parse(md); } catch (e) { return md; }
        }
        return '<pre>' + escapeHtml(md) + '</pre>';
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      const contentBlockClasses = 'mb-6 empty:hidden break-words [&_h1]:font-serif [&_h2]:font-serif [&_h3]:font-serif [&_h1]:font-normal [&_h2]:font-normal [&_h3]:font-normal [&_h1]:mt-4 [&_h2]:mt-4 [&_h3]:mt-4 [&_h1]:mb-2 [&_h2]:mb-2 [&_h3]:mb-2 [&_h1:first-child]:mt-0 [&_pre]:bg-neutral-800 [&_pre]:dark:bg-neutral-700 [&_pre]:text-amber-50 [&_pre]:dark:text-neutral-200 [&_pre]:p-4 [&_pre]:rounded-lg [&_pre]:overflow-x-auto [&_pre]:text-sm [&_code]:font-mono [&_code]:text-[0.9em] [&_p]:my-2 [&_ul]:my-2 [&_ol]:my-2 [&_ul]:pl-6 [&_ol]:pl-6 [&_a]:text-accent [&_a]:dark:text-amber-400';

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      function enhanceCodeBlocks(container) {
        if (!container) return;
        const pres = container.querySelectorAll('pre');
        pres.forEach(function (pre) {
          const code = pre.querySelector('code');
          if (!code) return;
          if (pre.querySelector('.codeblock-copy')) return;
          pre.classList.add('codeblock');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'codeblock-copy';
          btn.textContent = 'Copy';
          btn.setAttribute('aria-label', 'Copy code to clipboard');
          btn.addEventListener('click', async function (e) {
            e.preventDefault();
            e.stopPropagation();
            const text = code.innerText || code.textContent || '';
            try {
              await copyTextToClipboard(text);
              btn.textContent = 'Copied';
              window.setTimeout(function () { btn.textContent = 'Copy'; }, 900);
            } catch (err) {
              btn.textContent = 'Failed';
              window.setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
            }
          });
          pre.appendChild(btn);
        });
      }

      function renderTopicContent(smartContent) {
        if (!smartContent || !smartContent.content) return '';
        const type = (smartContent.textOutputType || '').toLowerCase();
        return type === 'markdown' ? renderMarkdown(smartContent.content) : renderContent(smartContent.content);
      }

      function renderDetail(topic) {
        const navBar = document.getElementById('navBar');
        const navPosition = document.getElementById('navPosition');
        if (!topic) {
          if (navBar) navBar.classList.add('hidden');
          currentTopicId = null;
          detailEl.innerHTML = '<div class="text-muted dark:text-neutral-400 italic py-8">Select a topic from the sidebar.</div>';
          try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
          return;
        }
        currentTopicId = topic.uniqueId;
        try { history.replaceState(null, '', window.location.pathname + window.location.search + '#' + topic.uniqueId); } catch (e) {}
        const idx = orderedTopicIds.indexOf(topic.uniqueId);
        if (navBar) {
          navBar.classList.remove('hidden');
          navBar.classList.add('flex');
        }
        if (navPosition) navPosition.textContent = (idx >= 0 ? idx + 1 : 0) + ' / ' + orderedTopicIds.length;

        const ancestorNames = (topic.ancestors || []).map(a => a.name).filter(Boolean);
        const breadcrumb = ancestorNames.length ? ancestorNames.join(' › ') + ' › ' + (topic.name || '') : (topic.name || '');
        const bodyHtml = renderTopicContent(topic.smartContent);
        let sectionsHtml = '';
        (topic.sections || []).forEach(sec => {
          const secBody = renderTopicContent(sec.smartContent);
          const meta = [sec.createdDate, sec.updatedDate].filter(Boolean).map(d => new Date(d).toLocaleDateString()).join(' · ');
          sectionsHtml += `
            <div class="border border-border dark:border-neutral-600 rounded-lg p-3 sm:p-4 mb-4 bg-panel dark:bg-neutral-800 shadow-sm">
              <h3 class="font-serif text-lg m-0 mb-2 text-neutral-800 dark:text-neutral-100">${escapeHtml(sec.name || 'Section')}</h3>
              ${meta ? `<div class="text-xs text-muted dark:text-neutral-400 mb-2">${escapeHtml(meta)}</div>` : ''}
              <div class="${contentBlockClasses} section-body">${secBody}</div>
            </div>`;
        });
        detailEl.innerHTML = `
          <div class="text-[0.8125rem] text-muted dark:text-neutral-400 mb-2">${escapeHtml(breadcrumb)}</div>
          <h2 class="font-serif text-xl sm:text-2xl font-normal m-0 mb-3 text-neutral-800 dark:text-neutral-100">${escapeHtml(topic.name || 'Untitled')}</h2>
          ${topic.description ? `<p class="text-xs text-muted dark:text-neutral-400 mb-5">${escapeHtml(topic.description)}</p>` : ''}
          <div class="${contentBlockClasses} topic-body">${bodyHtml}</div>
          ${sectionsHtml ? '<div class="sections">' + sectionsHtml + '</div>' : ''}
        `;
        if (typeof hljs !== 'undefined') {
          detailEl.querySelectorAll('pre code').forEach(function (el) { hljs.highlightElement(el); });
        }
        enhanceCodeBlocks(detailEl);
        syncSidebarToCurrent();
      }

      function syncSidebarToCurrent() {
        if (!currentTopicId) return;
        treeContainer.querySelectorAll('.tree-toggle').forEach(b => { b.removeAttribute('aria-current'); });
        const li = treeContainer.querySelector('li[data-id="' + currentTopicId + '"]');
        if (!li) return;
        const btn = li.querySelector('.tree-toggle');
        if (btn) btn.setAttribute('aria-current', 'true');
        let el = li.parentElement;
        while (el && el !== treeContainer) {
          if (el.tagName === 'UL') {
            el.hidden = false;
            const prev = el.previousElementSibling;
            if (prev && prev.classList.contains('tree-toggle')) {
              prev.setAttribute('aria-expanded', 'true');
              const ch = prev.querySelector('.chevron');
              if (ch) ch.classList.add('rotate-90');
            }
          }
          el = el.parentElement;
        }
      }

      function goToByIndex(index) {
        if (orderedTopicIds.length === 0) return;
        const id = orderedTopicIds[index];
        const topic = topicById.get(id);
        if (topic) {
          renderDetail(topic);
          if (isMobile()) closeSidebar();
        }
      }

      function goToPrev() {
        if (orderedTopicIds.length === 0) return;
        const idx = orderedTopicIds.indexOf(currentTopicId);
        const current = idx >= 0 ? idx : 0;
        const next = (current - 1 + orderedTopicIds.length) % orderedTopicIds.length;
        goToByIndex(next);
      }

      function goToNext() {
        if (orderedTopicIds.length === 0) return;
        const idx = orderedTopicIds.indexOf(currentTopicId);
        const current = idx >= 0 ? idx : 0;
        const next = (current + 1) % orderedTopicIds.length;
        goToByIndex(next);
      }

      function topicMatches(topic, filter) {
        if (!filter) return true;
        return (topic.name || '').toLowerCase().includes(filter.toLowerCase());
      }

      function hasMatchingDescendant(topicId, filter) {
        if (!filter) return true;
        const topic = topicById.get(topicId);
        if (!topic) return false;
        if (topicMatches(topic, filter)) return true;
        const kids = childrenByParentId.get(topicId) || [];
        return kids.some(function (k) { return hasMatchingDescendant(k.uniqueId, filter); });
      }

      function treeItem(topic, depth, filter) {
        const kids = childrenByParentId.get(topic.uniqueId) || [];
        const name = (topic.name || '').toLowerCase();
        const match = topicMatches(topic, filter);
        const childrenFiltered = filter
          ? kids.filter(function (t) { return topicMatches(t, filter) || hasMatchingDescendant(t.uniqueId, filter); })
          : kids;
        const hasVisibleChildren = childrenFiltered.length > 0;
        const id = 'topic-' + topic.uniqueId;
        const isOpen = depth === 0 || match || hasVisibleChildren;

        let childLis = '';
        if (hasVisibleChildren) {
          childLis = '<ul class="list-none m-0 pl-4 [&_.tree-toggle]:pl-2 [&_ul_.tree-toggle]:text-[0.9375rem]">' +
            childrenFiltered.map(function (c) { return treeItem(c, depth + 1, filter); }).join('') +
            '</ul>';
        }

        return `
          <li class="m-0" data-id="${escapeHtml(topic.uniqueId)}">
            <button type="button" class="tree-toggle flex items-center gap-1 min-w-0 py-1.5 px-3 cursor-pointer border-0 bg-transparent w-full text-left font-inherit text-neutral-800 dark:text-neutral-200 hover:bg-hover dark:hover:bg-neutral-700" id="${id}" aria-expanded="${isOpen}" data-id="${escapeHtml(topic.uniqueId)}">
              ${hasVisibleChildren ? `<span class="chevron w-[18px] shrink-0 opacity-60 transition-transform ${isOpen ? 'rotate-90' : ''}">▶</span>` : '<span class="w-[18px] shrink-0" aria-hidden="true"></span>'}
              <span class="min-w-0 truncate" title="${escapeHtml((topic.name || 'Untitled').replace(/"/g, '&quot;'))}">${escapeHtml(topic.name || 'Untitled')}</span>
            </button>
            ${childLis}
          </li>`;
      }

      function renderTree(filter) {
        const roots = (childrenByParentId.get('__root') || []);
        const filtered = filter
          ? roots.filter(function (t) { return topicMatches(t, filter) || hasMatchingDescendant(t.uniqueId, filter); })
          : roots;
        treeContainer.innerHTML = '<ul class="list-none m-0 p-0">' +
          filtered.map(function (t) { return treeItem(t, 0, filter); }).join('') +
          '</ul>';

        treeContainer.querySelectorAll('.tree-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const topic = topicById.get(id);
            if (topic) {
              treeContainer.querySelectorAll('.tree-toggle').forEach(b => { b.removeAttribute('aria-current'); });
              btn.setAttribute('aria-current', 'true');
              const li = btn.closest('li');
              const childList = li.querySelector(':scope > ul');
              if (childList) {
                const open = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !open);
                const chev = btn.querySelector('.chevron');
                if (chev && !chev.classList.contains('opacity-20')) chev.classList.toggle('rotate-90', !open);
                childList.hidden = open;
              }
              renderDetail(topic);
              if (isMobile()) closeSidebar();
            }
          });
        });

        treeContainer.querySelectorAll('li > ul').forEach(ul => {
          const btn = ul.previousElementSibling;
          const open = btn && btn.getAttribute('aria-expanded') === 'true';
          ul.hidden = !open;
        });
        syncSidebarToCurrent();
      }

      function run(data) {
        if (!Array.isArray(data)) {
          statusEl.textContent = 'Invalid data: expected an array.';
          treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Invalid JSON structure.</div>';
          return;
        }
        topics = data;
        buildIndex();
        statusEl.textContent = topics.length + ' topics loaded.';
        renderTree(searchInput.value.trim());
        var hashId = (location.hash || '').replace(/^#/, '').trim();
        if (hashId && topicById.get(hashId)) {
          renderDetail(topicById.get(hashId));
        }
      }

      function loadFromUrl() {
        fetch('data/topics-export-flat.json')
          .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(run)
          .catch(err => {
            statusEl.textContent = 'Load failed.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Could not load <code>data/topics-export-flat.json</code>. Serve this folder with a local server (e.g. <code>npm start</code>) or use "Load from file".</div>';
            console.error(err);
          });
      }

      fileInput.addEventListener('change', () => {
        const f = fileInput.files[0];
        if (!f) return;
        statusEl.textContent = 'Loading…';
        const r = new FileReader();
        r.onload = () => {
          try {
            run(JSON.parse(r.result));
          } catch (e) {
            statusEl.textContent = 'Parse error.';
            treeContainer.innerHTML = '<div class="py-8 text-center text-red-800 dark:text-red-400">Invalid JSON.</div>';
          }
        };
        r.readAsText(f);
      });

      searchInput.addEventListener('input', () => {
        if (topics.length) renderTree(searchInput.value.trim());
      });

      document.getElementById('prevBtn').addEventListener('click', goToPrev);
      document.getElementById('nextBtn').addEventListener('click', goToNext);

      window.addEventListener('hashchange', function () {
        var hashId = (location.hash || '').replace(/^#/, '').trim();
        if (!hashId || !topicById.get(hashId)) return;
        if (hashId === currentTopicId) return;
        renderDetail(topicById.get(hashId));
      });

      loadFromUrl();
    })();
  </script>
</body>
</html>
